<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>VEIO.GG - Inicio de Transmissao</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#020510;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{width:1840px;height:1000px;background:#070D1F;border:3px solid #00FF66;box-shadow:0 0 22px rgba(0,255,102,0.55),inset 0 0 50px rgba(0,255,102,0.04);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:framePulse 2.2s ease-in-out infinite}
@keyframes framePulse{0%,100%{box-shadow:0 0 22px rgba(0,255,102,0.55),inset 0 0 50px rgba(0,255,102,0.04);border-color:#00FF66}50%{box-shadow:0 0 38px rgba(0,255,102,0.85),inset 0 0 70px rgba(0,255,102,0.08);border-color:#3CFF8E}}
.stripes{position:absolute;top:0;left:0;right:0;height:16px;background:repeating-linear-gradient(-45deg,#00FF66 0 16px,transparent 16px 32px);background-size:200% 100%;border-bottom:3px solid #00FF66;animation:stripesMove 1s linear infinite;opacity:1}
@keyframes stripesMove{0%{background-position:0 0}100%{background-position:64px 0}}
.corner{position:absolute;width:22px;height:22px;border:4px solid #00FF66;z-index:5}
.corner.tl{top:-3px;left:-3px;border-right:none;border-bottom:none}
.corner.tr{top:-3px;right:-3px;border-left:none;border-bottom:none}
.corner.bl{bottom:-3px;left:-3px;border-right:none;border-top:none}
.corner.br{bottom:-3px;right:-3px;border-left:none;border-top:none}
/* scanlines */
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:0.07;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,255,102,0.3) 2px 3px);z-index:2}
/* particles */
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.p{position:absolute;width:3px;height:3px;background:#00FF66;border-radius:50%;opacity:0.6;box-shadow:0 0 6px #00FF66;animation:floatP linear infinite}
@keyframes floatP{0%{transform:translateY(1000px) translateX(0);opacity:0}10%{opacity:0.7}90%{opacity:0.7}100%{transform:translateY(-20px) translateX(60px);opacity:0}}
.badge{border:2px solid #00FF66;background:#000;color:#00FF66;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:5px;padding:9px 20px;box-shadow:0 0 12px rgba(0,255,102,0.6);margin-bottom:26px;z-index:3;position:relative}
.logo-box{width:310px;height:310px;border:3px solid #00FF66;box-shadow:0 0 22px rgba(0,255,102,0.6),0 0 40px rgba(122,0,255,0.25);background:#000;position:relative;overflow:hidden;z-index:3;animation:logoGlow 3s ease-in-out infinite}
@keyframes logoGlow{0%,100%{box-shadow:0 0 22px rgba(0,255,102,0.6),0 0 30px rgba(122,0,255,0.2)}50%{box-shadow:0 0 30px rgba(0,255,102,0.9),0 0 50px rgba(122,0,255,0.45)}}
.logo-box img{width:100%;height:100%;object-fit:cover;display:block;animation:breathing 3.5s ease-in-out infinite;transform-origin:center}
@keyframes breathing{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.03) translateY(-4px)}}
/* glitch layers */
.glitch{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0}
.logo-box.glitching{animation:logoGlitch 0.35s steps(2,end)}
@keyframes logoGlitch{0%{transform:translate(0)}20%{transform:translate(-2px,1px);filter:hue-rotate(10deg)}40%{transform:translate(2px,-1px);filter:hue-rotate(-10deg)}60%{transform:translate(-1px,0)}80%{transform:translate(1px,1px)}100%{transform:translate(0)}}
.titulo{font-family:'Press Start 2P',monospace;font-size:34px;color:#fff;letter-spacing:2px;margin-top:32px;z-index:3;text-shadow:0 0 12px rgba(0,255,102,0.85),3px 0 0 #00FF66;animation:flicker 4s steps(30,end) infinite}
@keyframes flicker{0%,96%,100%{opacity:1;text-shadow:0 0 12px rgba(0,255,102,0.85),3px 0 0 #00FF66}97%{opacity:0.85;text-shadow:0 0 2px rgba(0,255,102,0.5)}98%{opacity:1}99%{opacity:0.7}}
.titulo span{color:#00FF66}
.subtitulo{font-family:'Press Start 2P',monospace;font-size:11px;color:#FFD700;letter-spacing:3px;margin-top:18px;z-index:3;text-shadow:0 0 10px rgba(255,215,0,0.7);animation:subPulse 1.8s ease-in-out infinite}
@keyframes subPulse{0%,100%{opacity:1;text-shadow:0 0 10px rgba(255,215,0,0.7)}50%{opacity:0.85;text-shadow:0 0 18px rgba(255,215,0,1)}}
.conectando{font-family:'Press Start 2P',monospace;font-size:9.5px;color:#AAB2C8;letter-spacing:2px;margin-top:16px;z-index:3}
.dots{letter-spacing:4px}
.loading{display:flex;gap:14px;margin-top:34px;z-index:3}
.dot{width:14px;height:14px;border-radius:50%;background:#2A3347;transition:all 0.3s;box-shadow:inset 0 0 4px rgba(0,0,0,0.5)}
.dot.active:nth-child(1){background:#FF2A6D;box-shadow:0 0 12px #FF2A6D,0 0 22px #FF2A6D;transform:scale(1.25)}
.dot.active:nth-child(2){background:#05D9E8;box-shadow:0 0 12px #05D9E8,0 0 22px #05D9E8;transform:scale(1.25)}
.dot.active:nth-child(3){background:#FFD700;box-shadow:0 0 12px #FFD700,0 0 22px #FFD700;transform:scale(1.25)}
/* subtle vignette */
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,0.6);z-index:2}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="stripes"></div>
  <div class="scanlines"></div>
  <div class="particles" id="particles"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="badge">AO VIVO</div>
  <div class="logo-box" id="logoBox">
    <img src="logo-veiogg.png" alt="VeioGG" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;background:#0a0a14;color:#fff;font-family:'Press Start 2P',monospace;font-size:22px;text-shadow:2px 2px 0 #7A00FF">Veio GG</div>
  </div>
  <div class="titulo">VEIO<span>.GG</span></div>
  <div class="subtitulo">INÃCIO DE TRANSMISSÃƒO</div>
  <div class="conectando">CONECTANDO AO SERVIDOR<span class="dots" id="dots"></span></div>
  <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<script>
// partÃ­culas flutuantes
const pContainer=document.getElementById('particles');
for(let i=0;i<22;i++){
  const d=document.createElement('div');d.className='p';
  d.style.left=Math.random()*100+'%';
  d.style.animationDuration=(6+Math.random()*6)+'s';
  d.style.animationDelay=(Math.random()*6)+'s';
  d.style.opacity=0.3+Math.random()*0.5;
  pContainer.appendChild(d);
}
// dots animados CONECTANDO...
const dotsEl=document.getElementById('dots');
let dotCount=0;setInterval(()=>{dotCount=(dotCount+1)%4;dotsEl.textContent='.'.repeat(dotCount)},380);
// luzes sequenciais embaixo
const dots=document.querySelectorAll('.dot');
let idx=0;setInterval(()=>{dots.forEach(d=>d.classList.remove('active'));dots[idx].classList.add('active');idx=(idx+1)%3},420);
// glitch ocasional
const logoBox=document.getElementById('logoBox');const frame=document.getElementById('frame');
setInterval(()=>{
  if(Math.random()<0.35){
    logoBox.classList.add('glitching');
    frame.style.transform='translateX('+(Math.random()<0.5?1:-1)+'px)';
    setTimeout(()=>{logoBox.classList.remove('glitching');frame.style.transform='translateX(0)';},280);
  }
},1800);
</script>
<script src="btop.js"></script>
</body>
</html>
